services:
  postgres:
    image: postgres:16-alpine
    container_name: coworking_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: coworking_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d coworking_db']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coworking_backend_api
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/coworking_db?schema=public'
      JWT_SECRET: 'docker_super_secret_jwt_key_12345'
      JWT_REFRESH_SECRET: 'docker_super_secret_jwt_refresh_key_98765'
      CORS_ORIGIN: 'http://localhost:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
